<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KruVanda Database Quiz</title><style>body{font-family:Tahoma,Arial,sans-serif;background:linear-gradient(130deg,#fff1db,#ffe0e9);margin:0;color:#382b40}.wrap{max-width:760px;margin:25px auto;padding:18px}.panel{background:white;border-radius:22px;padding:25px;box-shadow:0 10px 35px #bd8c8c35}h1{color:#dc4c52;margin-bottom:6px}button{cursor:pointer;border:0;border-radius:12px;padding:13px 18px;font-size:17px} .primary{background:#f66c24;color:white;font-weight:bold}.opt{display:block;width:100%;text-align:left;margin:10px 0;background:#fff7f0;border:2px solid #f7ded2}.opt.selected{border-color:#ec6b26;background:#ffe5d1}.muted{color:#736778}.bar{height:12px;background:#eee;border-radius:12px;overflow:hidden}.fill{height:100%;background:#f58232;transition:width .2s}.hidden{display:none}.explain{background:#eef9ed;border-radius:12px;padding:12px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}input{padding:12px;border:1px solid #bbb;border-radius:9px;font-size:16px;max-width:90%}small{color:#766}</style></head><body><main class="wrap"><section class="panel"><h1>🎮 เลือกให้ถูก ไม่งั้นฐานข้อมูลพัง!</h1><p class="muted">KruVanda Database Classroom • Microsoft Access 2019</p><div id="start"><p>เกมฝึกคิด 10 ข้อ • ตอบได้ทีละข้อ • ดูคะแนนและเฉลยเมื่อจบ</p><label>ชื่อหรือรหัสผู้เล่น (ไม่จำเป็น): <input id="player" placeholder="เช่น ปวช3_01" maxlength="40"></label><p><button class="primary" onclick="begin()">เริ่มเล่นเกม</button></p><small>คะแนนเก็บอยู่เฉพาะในหน้านี้ ไม่ส่งข้อมูลไปยังครูโดยอัตโนมัติ</small></div><div id="game" class="hidden"><div class="row"><b id="counter"></b><span id="score"></span></div><div class="bar"><div id="fill" class="fill"></div></div><h2 id="question"></h2><div id="options"></div><button id="next" class="primary" disabled onclick="advance()">ข้อต่อไป</button></div><div id="result" class="hidden"><h2 id="summary"></h2><div id="review"></div><button class="primary" onclick="restart()">เล่นใหม่อีกครั้ง</button> <button onclick="window.print()">พิมพ์ / บันทึก PDF</button></div></section></main><script>const qs=[{q:'Field (ฟิลด์) ในตารางฐานข้อมูลหมายถึงอะไร?',o:['แถวข้อมูลหนึ่งรายการ','คอลัมน์ที่เก็บข้อมูลประเภทเดียวกัน','ชื่อไฟล์ฐานข้อมูล','โปรแกรมจัดการฐานข้อมูล'],a:1,e:'Field คือเขตข้อมูลหรือคอลัมน์ เช่น ชื่อ อายุ และวันเกิด'},{q:'Record (เรคคอร์ด) หมายถึงอะไร?',o:['ชุดข้อมูลหนึ่งแถว','ชื่อคอลัมน์','ชนิดข้อมูลตัวเลข','คำสั่งบันทึก'],a:0,e:'Record คือข้อมูลหนึ่งรายการหรือหนึ่งแถว เช่น ข้อมูลนักเรียนหนึ่งคน'},{q:'รหัสนักเรียน 00125 ควรเลือกชนิดข้อมูลใด?',o:['Number','Currency','Short Text','Yes/No'],a:2,e:'รหัสนักเรียนไม่ใช่จำนวนที่ใช้คำนวณ และต้องรักษาเลขศูนย์นำหน้า'},{q:'ข้อมูลประวัตินักเรียนที่ยาวหลายย่อหน้าควรใช้ชนิดใด?',o:['Long Text','AutoNumber','Currency','Yes/No'],a:0,e:'Long Text เหมาะสำหรับข้อความยาวหลายบรรทัดหรือหลายย่อหน้า'},{q:'จำนวนสินค้า 35 ชิ้น ที่ต้องนำไปคำนวณควรใช้ชนิดใด?',o:['Hyperlink','Number','Attachment','Short Text'],a:1,e:'Number เหมาะกับตัวเลขที่ต้องใช้คำนวณ เช่น จำนวนสินค้า'},{q:'ราคาสินค้า 159.50 บาทควรใช้ชนิดใด?',o:['Date/Time','Yes/No','Currency','OLE Object'],a:2,e:'Currency เหมาะสำหรับข้อมูลจำนวนเงิน'},{q:'ชนิดใดสร้างค่าหมายเลขให้ระเบียนใหม่โดยอัตโนมัติ?',o:['AutoNumber','Long Text','Hyperlink','Attachment'],a:0,e:'AutoNumber สร้างค่าตัวเลขอัตโนมัติ แต่ไม่รับประกันว่าเลขจะต่อเนื่องไม่มีช่องว่าง'},{q:'ฟิลด์วันเกิดควรใช้ชนิดใด?',o:['Currency','Date/Time','Calculated','Large Number'],a:1,e:'Date/Time เหมาะสำหรับข้อมูลวันเดือนปีและเวลา'},{q:'ข้อมูลสถานะ “ชำระแล้ว / ยังไม่ชำระ” เหมาะกับชนิดใด?',o:['Short Text','Number','Attachment','Yes/No'],a:3,e:'Yes/No ใช้สำหรับสถานะที่มีสองค่า'},{q:'ต้องการแสดงราคารวมจาก Price คูณ Quantity ในตารางเดียวกัน ควรเลือกชนิดใด?',o:['AutoNumber','Calculated','Hyperlink','Long Text'],a:1,e:'Calculated ใช้คำนวณค่าจากฟิลด์อื่นในระเบียนเดียวกัน เช่น [Price]*[Quantity]'}];let i=0,answers=[];function begin(){document.getElementById('start').classList.add('hidden');document.getElementById('game').classList.remove('hidden');show()}function show(){let q=qs[i];document.getElementById('counter').textContent='ข้อ '+(i+1)+' / '+qs.length;document.getElementById('score').textContent='ตอบแล้ว '+answers.length+' ข้อ';document.getElementById('fill').style.width=(i/qs.length*100)+'%';document.getElementById('question').textContent=q.q;document.getElementById('options').innerHTML='';q.o.forEach((o,j)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+j)+'. '+o;b.onclick=()=>{answers[i]=j;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('next').disabled=false};document.getElementById('options').appendChild(b)});document.getElementById('next').disabled=true;document.getElementById('next').textContent=i===qs.length-1?'ดูผลคะแนน':'ข้อต่อไป'}function advance(){i++;if(i<qs.length){show();return}document.getElementById('game').classList.add('hidden');document.getElementById('result').classList.remove('hidden');let points=qs.filter((q,j)=>q.a===answers[j]).length;document.getElementById('summary').textContent=(document.getElementById('player').value||'ผู้เล่น')+' ได้ '+points+' / '+qs.length+' คะแนน';document.getElementById('review').innerHTML='';qs.forEach((q,j)=>{let d=document.createElement('div');d.className='explain';d.textContent=(j+1)+'. '+q.q+' — '+(q.a===answers[j]?'✓ ถูก':'✗ ยังไม่ถูก')+' | เฉลย: '+q.o[q.a]+' | '+q.e;document.getElementById('review').appendChild(d)})}function restart(){i=0;answers=[];document.getElementById('result').classList.add('hidden');document.getElementById('start').classList.remove('hidden')}</script></body></html>
